<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2F5BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Knotebook">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<title>Knotebook</title>
<style>
:root{
  --desk:#D5DDE8; --dot:#AEBBCD; --paper:#FFFFFF; --ink:#1B2437; --ink2:#5A667C; --mute:#9AA5B8;
  --line:#E3E8F0; --raise:#FFFFFF; --hover:rgba(27,36,55,.07); --sel:#EEF2FF; --bar:rgba(255,255,255,.94);
  --blue:#2F5BFF; --rope:#8A6A3B; --rope2:#E6CF9C; --danger:#D6324A;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
body.dark{
  --desk:#0F1529; --dot:#27324F; --paper:#1B2440; --ink:#E8EDF9; --ink2:#A3AFCB; --mute:#6E7B9C;
  --line:#2B3659; --raise:#243052; --hover:rgba(255,255,255,.08); --sel:#26335E; --bar:rgba(24,31,54,.95);
  --blue:#5B7BFF; --rope:#B8914F; --rope2:#F0DDB0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--ui)}
body{position:fixed;inset:0;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{position:fixed;inset:0}

/* ---------- canvas ---------- */
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;background-color:var(--desk);
  background-image:radial-gradient(circle,var(--dot) 1.4px,transparent 1.7px);background-size:26px 26px}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cards{position:absolute;left:0;top:0}
#ropes{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1000000}
.r1{fill:none;stroke:var(--rope);stroke-width:6;stroke-linecap:round}
.r2{fill:none;stroke:var(--rope2);stroke-width:3;stroke-dasharray:5 5;stroke-linecap:round}
.knotc,.arrow{fill:var(--rope)}
.pill{pointer-events:all;cursor:pointer}
.pill rect,.pill circle{fill:var(--paper);stroke:var(--rope);stroke-width:2}
.pill text{font:600 12px var(--ui);fill:var(--ink)}
.plus{stroke:var(--rope);stroke-width:2;fill:none;stroke-linecap:round}
.rope-tmp{fill:none;stroke:var(--rope);stroke-width:5;stroke-dasharray:2 9;stroke-linecap:round}
#empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--ink2);pointer-events:none;max-width:260px;line-height:1.5}
#empty b{display:block;font:700 20px var(--serif);color:var(--ink);margin-bottom:4px}
#empty[hidden]{display:none}

/* ---------- cards ---------- */
.card{position:absolute;display:flex;flex-direction:column;background:var(--paper);border-radius:14px;
  border:1px solid rgba(27,36,55,.09);box-shadow:0 10px 26px -14px rgba(27,36,55,.45)}
.card.tinted{background:var(--tone);border-color:rgba(27,36,55,.12);
  --ink:#1B2437;--ink2:#4B5870;--mute:#6F7B92;--line:rgba(27,36,55,.14);--raise:#fff;--hover:rgba(27,36,55,.08);--blue:#2F5BFF;color:#1B2437}
.card.sel{box-shadow:0 0 0 2px var(--blue),0 14px 30px -14px rgba(27,36,55,.5)}
.card.target{outline:3px dashed var(--rope);outline-offset:4px}
.head{flex:none;height:40px;display:flex;align-items:center;gap:2px;padding-right:4px;touch-action:none;border-radius:14px 14px 0 0}
.card:not(.k-concept):not(.tinted) .head{border-bottom:1px solid var(--line)}
.grip{width:34px;height:40px;display:grid;place-items:center;color:var(--mute);cursor:grab;flex:none}
.title{flex:1;min-width:0;border:0;background:transparent;outline:0;font:700 16px var(--serif);color:inherit;
  padding:0 4px;height:32px;user-select:text;-webkit-user-select:text}
.title::placeholder{color:var(--mute);font-weight:500}
.acts{display:flex;flex:none}
.ib{width:30px;height:30px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:var(--ink2);padding:0}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--blue);color:#fff}
.ib[disabled]{opacity:.35}
.body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:0 0 14px 14px;overflow:hidden}
.knot{position:absolute;left:50%;bottom:-12px;width:24px;height:24px;margin-left:-12px;border-radius:50%;
  background:var(--rope2);border:4px solid var(--rope);padding:0;cursor:crosshair;touch-action:none;z-index:2}
.knot::after{content:"";position:absolute;inset:-10px}
.resize{position:absolute;right:3px;bottom:3px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:2;
  background:linear-gradient(135deg,transparent 52%,var(--mute) 52% 58%,transparent 58% 70%,var(--mute) 70% 76%,transparent 76%);
  opacity:.7;border-radius:0 0 12px 0}
.veil{display:none;position:absolute;left:0;right:0;top:40px;bottom:0;border-radius:0 0 14px 14px;place-items:center;
  background:repeating-linear-gradient(135deg,#EDF0F6 0 10px,#E4E9F2 10px 20px);color:#5A667C}
body.dark .veil{background:repeating-linear-gradient(135deg,#222C4A 0 10px,#1E2743 10px 20px);color:#A3AFCB}
.locked .veil{display:grid}
.locked .body{visibility:hidden}
.unlock{border:0;background:transparent;display:grid;gap:4px;justify-items:center;color:inherit;padding:16px}
.unlock b{font-size:14px}
.unlock small{font-size:12px}

/* text + concept */
.editor{flex:1;min-height:0;overflow:auto;padding:10px 14px 16px;outline:0;font:15px/1.55 var(--ui);user-select:text;-webkit-user-select:text}
.editor.empty::before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.editor h1{font:700 24px/1.2 var(--serif);margin:.2em 0 .3em}
.editor h2{font:700 18px/1.25 var(--serif);margin:.4em 0 .25em}
.editor ul,.editor ol{margin:.3em 0;padding-left:1.3em}
.fmt{flex:none;display:flex;gap:4px;padding:6px 10px 0}
.fb{min-width:34px;height:30px;border:1px solid var(--line);background:var(--raise);border-radius:8px;font-size:13px;padding:0 8px}
.fb:hover{background:var(--hover)}
.k-concept{background:var(--tone,#FFF1A8)}
.k-concept .editor{font:17px/1.45 var(--serif)}
.k-concept .title{font-size:18px}

/* steps */
.steps{list-style:none;margin:0;padding:8px 10px 0;overflow:auto;flex:1;min-height:0}
.steps li{display:flex;align-items:center;gap:8px;min-height:36px}
.chk{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--mute);background:var(--raise);display:grid;place-items:center;padding:0;color:#fff}
.done .chk{background:var(--blue);border-color:var(--blue)}
.steps input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:15px var(--ui);height:34px;color:var(--ink);user-select:text;-webkit-user-select:text}
.done input{color:var(--mute);text-decoration:line-through}
.steps .rm{opacity:0;width:26px;height:26px}
.steps li:hover .rm,.steps li:focus-within .rm{opacity:1}
.addstep{flex:none;margin:2px 10px 0;height:32px;border:0;background:transparent;color:var(--blue);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:flex-start;padding:0 4px}
.prog{flex:none;margin:0 14px 12px;font-size:12px;color:var(--ink2)}

/* code */
.k-code{background:#12172A;border-color:#0B0F20;color:#DDE4F5}
.k-code .head{background:#0D1122;border-bottom:1px solid #1E2745!important}
.k-code .title{font:600 13px var(--mono);color:#DDE4F5}
.k-code .title::placeholder{color:#55627A}
.k-code .grip{color:#55627A}
.k-code .ib{color:#8E9BBE}
.k-code .ib:hover{background:rgba(255,255,255,.08)}
.codebar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#0F1426;border-bottom:1px solid #1E2745;font:12px var(--mono);color:#7D8BAE}
.codebar select{background:#1A2140;color:#C9D3F0;border:1px solid #2A3560;border-radius:7px;font:12px var(--mono);height:26px;padding:0 6px}
.codebar .pos{margin-left:auto}
.codebar .copy{border:1px solid #2A3560;background:transparent;color:#C9D3F0;border-radius:7px;height:26px;padding:0 10px;font:12px var(--mono)}
.codewrap{flex:1;min-height:0;display:flex;font:13px/20px var(--mono);font-variant-ligatures:none}
.gutter{margin:0;padding:12px 8px 12px 12px;color:#44506F;text-align:right;overflow:hidden;white-space:pre;background:#0F1426;font:inherit;user-select:none;-webkit-user-select:none}
.ed{position:relative;flex:1;min-width:0}
.hl,.ta{position:absolute;inset:0;margin:0;padding:12px 14px;border:0;font:inherit;font-variant-ligatures:none;
  white-space:pre;tab-size:2;letter-spacing:0;word-spacing:0;overflow:auto;scrollbar-width:thin}
.hl{overflow:hidden;color:#DDE4F5;pointer-events:none}
.ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#7CE6FF;resize:none;outline:0;
  user-select:text;-webkit-user-select:text}
.ta::placeholder{color:#44506F;-webkit-text-fill-color:#44506F}
.ta::selection{background:rgba(95,130,255,.4);-webkit-text-fill-color:transparent}
.t-kw{color:#C792EA}.t-str{color:#A5E8A0}.t-num{color:#F8A978}.t-fn{color:#7FB4FF}.t-com{color:#5C6B91;font-style:italic}.t-tag{color:#FF7A90}

/* image + pdf */
.imgwrap{position:relative;flex:1;min-height:0;background:var(--line)}
.imgwrap img,.pgwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.drawing .ink{pointer-events:auto;cursor:crosshair}
.pick{position:absolute;inset:10px;border:2px dashed var(--mute);border-radius:10px;background:transparent;display:grid;place-content:center;justify-items:center;gap:4px;color:var(--ink2);text-align:center;padding:8px}
.pick b{color:var(--ink);font-size:14px}.pick small{font-size:12px}
.inktools{display:none;gap:6px;align-items:center;padding:6px;background:var(--bar);border-radius:12px;box-shadow:0 6px 18px -8px rgba(0,0,0,.5);overflow-x:auto;color:var(--ink)}
.inktools.over{position:absolute;left:8px;right:8px;bottom:8px}
.inktools.strip{margin:6px 8px 0;flex:none}
.drawing .inktools{display:flex}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.hi{border-radius:7px;background:#FFE14D}
.tb{height:28px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:0 9px;font-size:12px;flex:none}
.pages{flex:1;min-height:0;overflow-y:auto;padding:8px;display:grid;gap:8px;align-content:start;background:var(--line)}
.pgwrap{position:relative;width:100%;background:#fff;box-shadow:0 2px 8px -4px rgba(0,0,0,.4)}

/* math */
.mathin{flex:1 1 40%;min-height:56px;border:0;border-bottom:1px solid var(--line);background:transparent;resize:none;outline:0;padding:10px 14px;font:14px/1.6 var(--mono);color:var(--ink);user-select:text;-webkit-user-select:text}
.mathin::placeholder{color:var(--mute)}
.mathout{flex:1 1 60%;min-height:0;overflow:auto;padding:8px 14px}
.ml{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:3px 0}
.mf{font:18px/1.6 var(--serif);color:var(--ink)}
.mf sup,.mf sub{font-size:.65em}
.ov{border-top:1.5px solid currentColor;padding:0 2px}
.mr{color:var(--blue);font:600 15px var(--ui)}
.mc{color:var(--mute);font:italic 14px var(--ui)}
.mhint{color:var(--mute);font-size:13px;line-height:1.5}

/* link */
.lk{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.lkrow{display:flex;gap:8px;align-items:center}
.lk select{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--raise);color:var(--ink);padding:0 8px;font:13px var(--ui)}
.lk .host{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .url,.lk .lknote{border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--ink);font:15px var(--ui);padding:0 10px;outline:0;user-select:text;-webkit-user-select:text}
.lk .url{height:40px}
.lk .lknote{flex:1;min-height:50px;resize:none;padding:8px 10px;line-height:1.45}
.lkbtns{display:flex;gap:8px}
.lkbtns .open,.lkbtns button{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);padding:0 12px;font:600 13px var(--ui);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.lkbtns .open{background:var(--blue);border-color:var(--blue);color:#fff}
.lkbtns .open.off{opacity:.4;pointer-events:none}

/* ---------- chrome ---------- */
#top{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
.bar{background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;box-shadow:0 8px 24px -12px rgba(27,36,55,.5)}
#menuBtn{flex:1;min-width:0;max-width:240px;height:44px;border:0;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left}
#pageName{font:700 16px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#searchBtn{margin-left:auto;width:44px;height:44px;border:0;display:grid;place-items:center}
#zoom{display:flex;height:44px;align-items:center;padding:0 2px}
#zoom button{border:0;background:transparent;height:36px;min-width:32px;border-radius:10px;font-size:15px}
#zoom button:hover{background:var(--hover)}
#zFit{font-size:12px!important;min-width:44px!important;color:var(--ink2)}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;z-index:20;border-radius:22px;align-items:center}
#dock button{width:56px;height:52px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;gap:1px;font-size:11px;color:var(--ink2);padding:4px 0 2px}
#dock button:hover{background:var(--hover)}
#dock button.dis{opacity:.35;pointer-events:none}
#dock button.main{background:var(--blue);color:#fff;width:62px;height:52px;border-radius:17px;margin:0 4px}
#exitFocus{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:30;height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
body.focus #exitFocus{display:block}
body.focus #top,body.focus #dock{display:none}
body.focus .card:not(.focused){opacity:.12;pointer-events:none}
body.focus #ropes{opacity:.15}

#scrim{position:absolute;inset:0;background:rgba(18,23,42,.4);z-index:40}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--paper);z-index:50;padding:max(16px,env(safe-area-inset-top)) 16px 16px;
  transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px rgba(0,0,0,.25);overflow:auto}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh h1{margin:0;font:700 24px var(--serif)}
.sub{margin:6px 0 0;font-size:13px;color:var(--ink2)}
#pageList{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#pageList li{display:flex;align-items:center;border-radius:12px}
#pageList li.on{background:var(--sel)}
#pageList .pg{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:11px 10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pageList .pg small{font-weight:400;color:var(--ink2);margin-left:6px}
.df{display:flex;gap:8px;flex-wrap:wrap}
.fine{font-size:12px;line-height:1.5;color:var(--ink2);margin:4px 0 0}

#modal{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
#modal[hidden],#scrim[hidden]{display:none}
.mscrim{position:absolute;inset:0;background:rgba(18,23,42,.5)}
.sheet{position:relative;width:min(380px,100%);max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 10px;font:700 20px var(--serif)}
.fld{display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.fld input,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:0 12px;font:16px var(--ui);color:var(--ink);background:var(--raise);outline:0;user-select:text;-webkit-user-select:text}
.fld input{height:44px}
.fld textarea{min-height:120px;padding:10px 12px;resize:vertical;line-height:1.45}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,255,.18)}
.hint{margin:8px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.merr{color:var(--danger);font-size:13px;margin:8px 0 0}
.merr:empty{display:none}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{display:grid;place-items:center;gap:6px;padding:14px 4px 10px;border:1px solid var(--line);background:var(--raise);border-radius:14px;font-size:13px;font-weight:600}
.gi:active{background:var(--sel)}
.res{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;display:grid;gap:2px}
.res button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px}
.res button:hover{background:var(--hover)}
.res b{font-size:14px}
.res small{display:block;color:var(--ink2);margin-top:2px;line-height:1.4}
.stats{width:100%;border-collapse:collapse;font-size:14px}
.stats th,.stats td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.stats th:first-child,.stats td:first-child{text-align:left;color:var(--ink2)}
.stats th{font-size:12px;color:var(--ink2)}
.swatches{display:flex;gap:10px;margin:2px 0 12px}
.tone{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.tone.on{box-shadow:0 0 0 2px var(--blue)}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 8px;border-radius:10px;font-size:15px;text-align:left}
.mi:hover{background:var(--hover)}
.mi.danger{color:var(--danger)}
#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
</style>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="Notebook canvas">
    <div id="world">
      <div id="cards"></div>
      <svg id="ropes" aria-label="Ropes between notes"></svg>
    </div>
    <div id="empty" hidden><b>An empty page</b>Tap the + button, or double-tap anywhere on the canvas, to add your first note.</div>
  </main>

  <header id="top">
    <button id="menuBtn" class="bar" aria-label="Pages"></button>
    <button id="searchBtn" class="bar" aria-label="Search"></button>
    <div id="zoom" class="bar">
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="zFit" aria-label="Fit everything on screen">100%</button>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
  </header>

  <nav id="dock" class="bar" aria-label="Actions"></nav>

/* =====================  card types  ===================== */

function newCard(type, x, y, over = {}) {

  async set(k, obj) {
    const s = JSON.stringify(obj);

    try { localStorage.setItem(k, s); return true; } catch (e) { return false; }
  },

async function loadAll() {

/* ---------- validation / sanitising ---------- */
const OK_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'H1', 'H2', 'H3', 'UL', 'OL', 'LI', 'DIV', 'P', 'BR', 'SPAN']);
function clean(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html || '');
  const walk = n => {
    [...n.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        if (!OK_TAGS.has(ch.tagName)) ch.replaceWith(document.createTextNode(ch.textContent));
        else { [...ch.attributes].forEach(a => ch.removeAttribute(a.name)); walk(ch); }
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  walk(t.content);
  return t.innerHTML;
}
const isHex = v => typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v);
const isImg = v => typeof v === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v);
function cleanStrokes(arr) {
  if (!Array.isArray(arr)) return [];

    c: isHex(s.c) ? s.c : '#1B2437', h: !!s.h, w: clamp(typeof s.w === 'number' ? s.w : .012, .002, .1),

}

    p = p || {};
    const ids = new Set();

      const base = clone(DEF[c.type]);
      const k = Object.assign({}, base, c);
      k.type = c.type;
      k.id = String(k.id || uid()).slice(0, 20); while (ids.has(k.id)) k.id = uid(); ids.add(k.id);
      k.x = num(k.x, 0); k.y = num(k.y, 0); k.w = clamp(num(k.w, base.w), 180, 1400); k.z = num(k.z, 1);
      k.locked = !!k.locked; k.pin = typeof k.pin === 'string' ? k.pin.slice(0, 20) : '';
      k.title = String(k.title || '').slice(0, 60);
      k.color = isHex(k.color) ? k.color : (k.type === 'concept' ? TONES[0] : '');

          k.src = isImg(k.src) ? k.src : null; k.ar = clamp(num(k.ar, .75), .35, 1.8);

        case 'pdf':
          k.pages = (Array.isArray(k.pages) ? k.pages : []).slice(0, 20).filter(g => g && isImg(g.src))
            .map(g => ({ src: g.src, ar: clamp(num(g.ar, 1.4), .4, 2.5), strokes: cleanStrokes(g.strokes) }));
          k.h = clamp(num(k.h, base.h), 200, 1800); break;
        case 'tasks':
          k.items = (Array.isArray(k.items) && k.items.length ? k.items : base.items).slice(0, 100).map(i => ({ t: String((i && i.t) || '').slice(0, 300), d: !!(i && i.d) }));
          k.h = clamp(num(k.h, base.h), 140, 1800); break;

        case 'math':

          if (!own(KINDS, k.kind)) k.kind = 'link'; k.h = clamp(num(k.h, base.h), 190, 1800); break;
      }
      return k;
    });
    const pairs = new Set();
    const ropes = (Array.isArray(p.ropes) ? p.ropes : []).slice(0, 1200).filter(r => r && ids.has(r.from) && ids.has(r.to) && r.from !== r.to).filter(r => {
      const key = r.from + '>' + r.to; if (pairs.has(key)) return false; pairs.add(key); return true;
    }).map(r => ({ id: String(r.id || uid()).slice(0, 20), from: r.from, to: r.to, label: String(r.label || '').slice(0, 40) }));
    const v = p.view && isFinite(p.view.x) && isFinite(p.view.y) && isFinite(p.view.z) ? { x: p.view.x, y: p.view.y, z: clamp(p.view.z, .2, 2.5) } : null;
    let pid = String(p.id || uid()).slice(0, 20); while (seen.has(pid)) pid = uid(); seen.add(pid);
    return { id: pid, name: String(p.name || 'Page').slice(0, 40), cards, ropes, view: v };
  });
  const cur = pages.some(p => p.id === o.current) ? o.current : pages[0].id;
  return { pages, current: cur, theme: o.theme === 'dark' ? 'dark' : 'light' };
}

function seed() {

  const plan = newCard('text', 340, -30, { w: 330, h: 250, title: 'Plan', html: '<h2>What it needs</h2><ul><li>A box to type a city</li><li>Show the temperature</li><li>Look nice on a phone</li></ul>' });

}

/* =====================  undo / redo  ===================== */

document.addEventListener('keydown', e => {

/* =====================  syntax highlighting  ===================== */
const LANGS = {
  js: { name: 'JavaScript', file: 'main.js', ph: '// start typing code here', kw: new Set('const let var function return if else for while do class new import export from default async await try catch finally throw switch case break continue true false null undefined this typeof of in extends super'.split(' ')),
        re: () => /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|`(?:[^`\\]|\\.)*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)/g },
  py: { name: 'Python', file: 'main.py', ph: '# start typing code here', kw: new Set('def return if elif else for while class import from as with try except finally raise True False None and or not in is lambda pass break continue yield global'.split(' ')),
        re: () => /(#[^\n]*)|("""[\s\S]*?(?:"""|$)|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g },
  html: { name: 'HTML', file: 'index.html', ph: '<!-- start typing HTML here -->', html: true, kw: new Set(),
        re: () => /(<!--[\s\S]*?(?:-->|$))|("[^"\n]*"?|'[^'\n]*'?)|(<\/?[A-Za-z][\w-]*|\/?>)/g },
  txt: { name: 'Plain text', file: 'notes.txt', ph: 'Type anything' }
};
function kindOf(m, spec) {
  if (m[1] !== undefined) return 'com';
  if (m[2] !== undefined) return 'str';
  if (spec.html) return m[3] !== undefined ? 'tag' : '';
  if (m[3] !== undefined) return 'num';
  const w = m[4] || m[5];
  if (spec.kw.has(w)) return 'kw';
  return m[4] ? 'fn' : '';
}
function highlight(code, lang) {
  const spec = LANGS[lang];
  if (!spec || !spec.re) return esc(code) + '\n ';
  const re = spec.re();
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    if (m[0].length === 0) { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const k = kindOf(m, spec);
    out += k ? `<span class="t-${k}">${esc(m[0])}</span>` : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last)) + '\n ';
}

/* =====================  maths helpers  ===================== */
const GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', theta: 'θ', lambda: 'λ', mu: 'μ', pi: 'π', sigma: 'σ', omega: 'ω', phi: 'φ', Delta: 'Δ', Sigma: 'Σ', Omega: 'Ω', inf: '∞' };
function pretty(line) {
  let s = esc(line);
  for (let k = 0; k < 5; k++) s = s.replace(/sqrt\(([^()]*)\)/g, '√<span class="ov">$1</span>');
  s = s.replace(/\^\(([^()]*)\)/g, '<sup>$1</sup>').replace(/\^(-?[A-Za-z0-9.]+)/g, '<sup>$1</sup>');

  modal({
    title: 'Quick note',
    html: '<label class="fld">Jot it down. It becomes a sticky note.<textarea id="qn" placeholder="An idea, a reminder, a question…"></textarea></label>',
    onOpen: s => setTimeout(() => $('#qn', s).focus(), 60),
    actions: [
      { label: 'Cancel' },
      { label: 'Add note', kind: 'primary', run: s => {
        const text = $('#qn', s).value.trim();
        if (!text) { $('.merr', s).textContent = 'Write something first.'; return false; }
        const p = page(), v = p.view, r = stage.getBoundingClientRect();
        const cx = pos ? pos.x : (r.width / 2 - v.x) / v.z, cy = pos ? pos.y : (r.height / 2 - v.y) / v.z - 20;
        const c = newCard('concept', Math.round(cx - 120 + (pos ? 0 : (Math.random() - .5) * 40)), Math.round(cy - 85 + (pos ? 0 : (Math.random() - .5) * 40)),
          { color: TONES[Math.floor(Math.random() * TONES.length)], html: text.split('\n').map(esc).join('<br>') });
        c.z = ++zTop; p.cards.push(c); mount(c); select(c.id); renderDrawer(); refreshEmpty(); touch();
      } }
    ]
  });
}

/* =====================  search + statistics  ===================== */
const plain = h => { const t = document.createElement('template'); t.innerHTML = h; return (t.content.textContent || '').replace(/\s+/g, ' ').trim(); };
function textOf(c) {
  if (c.locked) return '';
  switch (c.type) {
    case 'text': case 'concept': return plain(c.html);
    case 'code': return c.code;
    case 'tasks': return c.items.map(i => i.t).join('\n');
    case 'math': return c.text;
    case 'link': return c.url + '\n' + c.note;
    default: return '';
  }
}
function goTo(pageId, cardId) {
  if (pageId !== S.current) switchPage(pageId);
  const c = cardOf(cardId); if (!c) return;
  centerOn(c); bringFront(c); select(c.id);
}
function openSearch() {
  modal({
    title: 'Search',
    html: '<label class="fld"><input id="q" type="search" placeholder="Search titles and text on every page" autocomplete="off"></label><ul class="res" id="res"></ul>',
    actions: [{ label: 'Close' }],
    onOpen: (s, close) => {
      const q = $('#q', s), res = $('#res', s);
      const run = () => {
        const term = q.value.trim().toLowerCase();
        res.innerHTML = '';
        if (!term) { res.innerHTML = '<li class="hint">Type a word. Locked notes only match on their title.</li>'; return; }
        const hits = [];
        S.pages.forEach(p => p.cards.forEach(c => {
          const title = (c.title || '').toLowerCase(), body = textOf(c), low = body.toLowerCase();
          const ti = title.indexOf(term), bi = low.indexOf(term);
          if (ti < 0 && bi < 0) return;
          const snip = bi >= 0 ? (bi > 24 ? '…' : '') + body.slice(Math.max(0, bi - 24), bi + 56).replace(/\s+/g, ' ') + (body.length > bi + 56 ? '…' : '') : '';
          hits.push({ p, c, snip });
        }));
        if (!hits.length) { res.innerHTML = '<li class="hint">Nothing found.</li>'; return; }
        hits.slice(0, 40).forEach(h => {
          const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
          b.innerHTML = '<b></b><small></small><small></small>';
          $('b', b).textContent = nameOf(h.c);
          const sm = b.querySelectorAll('small');
          sm[0].textContent = `${NAMES[h.c.type]} on ${h.p.name}`; sm[1].textContent = h.snip; if (!h.snip) sm[1].remove();
          b.onclick = () => { close(); goTo(h.p.id, h.c.id); };
          li.appendChild(b); res.appendChild(li);
        });
      };
      q.addEventListener('input', run); run();
      setTimeout(() => q.focus(), 60);
    }
  });
}
function statsOf(pages) {
  const s = { pages: pages.length, notes: 0, ropes: 0, words: 0, lines: 0, done: 0, steps: 0, strokes: 0, locked: 0, links: 0, formulas: 0, pdfPages: 0, pictures: 0 };
  pages.forEach(p => {
    s.ropes += p.ropes.length;
    p.cards.forEach(c => {
      s.notes++;
      if (c.type === 'image') { s.pictures += c.src ? 1 : 0; s.strokes += c.strokes.length; }
      if (c.type === 'pdf') { s.pdfPages += c.pages.length; c.pages.forEach(g => s.strokes += g.strokes.length); }
      if (c.type === 'link') s.links++;
      if (c.type === 'math') s.formulas++;
      if (c.locked) { s.locked++; return; }
      if (c.type === 'text' || c.type === 'concept') s.words += (plain(c.html).match(/\S+/g) || []).length;
      if (c.type === 'link') s.words += (c.note.match(/\S+/g) || []).length;
      if (c.type === 'code') s.lines += c.code ? c.code.split('\n').length : 0;
      if (c.type === 'tasks') { s.steps += c.items.length; s.done += c.items.filter(i => i.d).length; }
    });
  });
  return s;
}
function openStats() {
  const a = statsOf([page()]), b = statsOf(S.pages);
  const rows = [['Notes', 'notes'], ['Ropes', 'ropes'], ['Words written', 'words'], ['Lines of code', 'lines'], ['Steps done', null], ['Formulas', 'formulas'], ['Links saved', 'links'], ['Pictures', 'pictures'], ['PDF pages', 'pdfPages'], ['Drawn strokes', 'strokes'], ['Locked notes', 'locked']];
  const kb = Math.round(JSON.stringify(S).length / 1024);
  modal({
    title: 'Statistics',
    html: `<table class="stats"><tr><th></th><th>This page</th><th>All ${b.pages} page${b.pages > 1 ? 's' : ''}</th></tr>${rows.map(([l, k]) =>
      `<tr><td>${l}</td><td>${k ? a[k] : `${a.done} of ${a.steps}`}</td><td>${k ? b[k] : `${b.done} of ${b.steps}`}</td></tr>`).join('')}</table><p class="hint">Locked notes are counted, but their text is not read. Notebook size is about ${kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB'}.</p>`,
    actions: [{ label: 'Close', kind: 'primary' }]
  });
}

/* =====================  dock, tools, pages  ===================== */
$('#dock').innerHTML = `<button id="undoBtn" type="button" class="dis" aria-label="Undo">${icon('undo', 20)}<span>Undo</span></button>`
  + `<button id="redoBtn" type="button" class="dis" aria-label="Redo">${icon('redo', 20)}<span>Redo</span></button>`
  + `<button id="addBtn" type="button" class="main" aria-label="Add a note">${icon('plus', 24)}</button>`
  + `<button id="quickBtn" type="button" aria-label="Quick note">${icon('bolt', 20)}<span>Quick</span></button>`
  + `<button id="toolsBtn" type="button" aria-label="Tools">${icon('sliders', 20)}<span>Tools</span></button>`;
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#addBtn').onclick = () => openAdd(null);
$('#quickBtn').onclick = () => openQuick(null);
$('#searchBtn').innerHTML = icon('search', 20);
$('#searchBtn').onclick = openSearch;
$('#toolsBtn').onclick = () => {
  const dark = S.theme === 'dark';
  const items = [['search', 'Search', 'search'], ['stats', 'Statistics', 'stats'], ['focus', 'Focus note', 'focus'], ['theme', dark ? 'Light theme' : 'Dark theme', dark ? 'sun' : 'moon'], ['center', 'Centre canvas', 'center'], ['fit', 'Fit all', 'focus']];
  modal({
    title: 'Tools',
    html: `<div class="grid">${items.map(([t, l, i]) => `<button type="button" class="gi" data-t="${t}">${icon(i, 22)}<span>${l}</span></button>`).join('')}</div>`,
    actions: [{ label: 'Close' }],
    onOpen: (s, close) => s.addEventListener('click', e => {
      const b = e.target.closest('.gi'); if (!b) return;
      close();
      const t = b.dataset.t;
      if (t === 'search') openSearch();
      else if (t === 'stats') openStats();
      else if (t === 'focus') { const c = selectedId && cardOf(selectedId); if (c) enterFocus(c); else toast('Tap a note first, then choose Focus note.'); }
      else if (t === 'theme') { S.theme = dark ? 'light' : 'dark'; applyTheme(); scheduleSave(); }
      else if (t === 'center') centerCanvas();
      else if (t === 'fit') fit();
    })
  });
};
function applyTheme() { document.body.classList.toggle('dark', S.theme === 'dark'); }

function openDrawer(on) { $('#drawer').classList.toggle('open', on); $('#scrim').hidden = !on; }
$('#menuBtn').innerHTML = `${icon('menu', 20)}<span id="pageName"></span>`;
$('#closeDrawer').innerHTML = icon('close', 18);
$('#menuBtn').onclick = () => { renderDrawer(); openDrawer(true); };
$('#closeDrawer').onclick = () => openDrawer(false);
$('#scrim').onclick = () => openDrawer(false);

function renderDrawer() {
  $('#pageName').textContent = page().name;
  const list = $('#pageList'); list.innerHTML = '';
  S.pages.forEach(p => {
    const li = document.createElement('li');
    li.className = p.id === S.current ? 'on' : '';
    li.innerHTML = `<button type="button" class="pg"><span></span><small>${p.cards.length}</small></button><button type="button" class="ib ren" aria-label="Rename page">${icon('pen', 15)}</button>${S.pages.length > 1 ? `<button type="button" class="ib del" aria-label="Delete page">${icon('trash', 15)}</button>` : ''}`;
    $('.pg span', li).textContent = p.name;
    $('.pg', li).onclick = () => { switchPage(p.id); openDrawer(false); };
    $('.ren', li).onclick = () => modal({
      title: 'Rename page', html: '<label class="fld">Page name<input id="pn" maxlength="40"></label>',
      onOpen: s => { const i = $('#pn', s); i.value = p.name; setTimeout(() => { i.focus(); i.select(); }, 60); },
      actions: [{ label: 'Cancel' }, { label: 'Save', kind: 'primary', run: s => { p.name = $('#pn', s).value.trim() || 'Page'; renderDrawer(); scheduleSave(); } }]
    });
    const del = $('.del', li);
    if (del) del.onclick = () => modal({
      title: 'Delete this page?', html: '<p class="hint">Every note and rope on it will be deleted. This cannot be undone.</p>',
      actions: [{ label: 'Cancel' }, { label: 'Delete', kind: 'danger', run: () => {
        S.pages = S.pages.filter(x => x.id !== p.id);
        dirty.delete(p.id); store.del(KEY + ':page:' + p.id);
        if (S.current === p.id) switchPage(S.pages[0].id); else renderDrawer();
        scheduleSave();
      } }]
    });
    list.appendChild(li);
  });
}
function switchPage(id) {
  snapNow();
  exitFocus();
  S.current = id; selectedId = null;
  const p = page();
  rebuild();
  if (!p.view) fit(); else applyView();
  resetHist(); scheduleSave();
}
$('#newPage').onclick = () => {
  const p = { id: uid(), name: 'Page ' + (S.pages.length + 1), cards: [], ropes: [], view: null };
  if (S.pages.length >= 60) { toast('That is the page limit.'); return; }
  S.pages.push(p); dirty.add(p.id); switchPage(p.id); openDrawer(false);
  const r = stage.getBoundingClientRect(); p.view = { x: r.width / 2, y: r.height / 2, z: 1 }; applyView();
  toast('New page. Tap + to add something.');
};
$('#exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
  a.download = 'knotebook-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Backup file created.');
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data = null;
  try { data = sanitizeState(JSON.parse(await f.text())); } catch (err) {}
  if (!data) { toast('That file is not a Knotebook backup.'); return; }
  modal({
    title: 'Replace everything?', html: '<p class="hint">This swaps all your current pages for the ones in the backup.</p>',
    actions: [{ label: 'Cancel' }, { label: 'Replace', kind: 'danger', run: () => {
      S.pages.forEach(p => store.del(KEY + ':page:' + p.id));
      S = data; dirty.clear(); S.pages.forEach(p => dirty.add(p.id)); idxDirty = true;
      applyTheme(); switchPage(S.current); openDrawer(false); arm(); toast('Backup loaded.');
    } }]
  });
});

/* =====================  modal + toast  ===================== */
function modal({ title, html = '', actions = [], onOpen }) {
  const m = $('#modal');
  m.innerHTML = `<div class="mscrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2></h2><div>${html}</div><p class="merr" role="alert"></p><div class="mact"></div></div>`;
  $('h2', m).textContent = title;
  m.hidden = false;
  const sheet = $('.sheet', m);
  const close = () => { m.hidden = true; m.innerHTML = ''; };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (a.kind || ''); b.textContent = a.label;
    b.addEventListener('click', () => { const r = a.run ? a.run(sheet) : undefined; if (r !== false) close(); });
    $('.mact', sheet).appendChild(b);
  });
  $('.mscrim', m).addEventListener('click', close);
  sheet.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'search') { const p = $('.btn.primary', sheet); if (p) p.click(); }
    if (e.key === 'Escape') close();
  });
  if (onOpen) onOpen(sheet, close);
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* =====================  start  ===================== */
(async function init() {
  S = sanitizeState(await loadAll()) || seed();
  if (!S.theme) S.theme = 'light';
  applyTheme();
  switchPage(S.current);
  dirty.clear(); S.pages.forEach(p => dirty.add(p.id)); idxDirty = true; arm(); // writes the new storage layout once
})();
})();
</script>
</body>
